name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build macOS release
    runs-on: macos-14

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on the default branch
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit reachable from main."
            exit 1
          fi

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Run pre-release checks
        env:
          APP_INSTALL_PATH: ${{ runner.temp }}/AudioPDF.app
        run: ./scripts/pre_release.sh

      - name: Verify release archive
        run: |
          test -f "dist/Audio-PDF-macOS-ad-hoc.zip"
          unzip -tq "dist/Audio-PDF-macOS-ad-hoc.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/Audio-PDF-macOS-ad-hoc.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --title "AudioPDF $GITHUB_REF_NAME" \
              --generate-notes
          fi
